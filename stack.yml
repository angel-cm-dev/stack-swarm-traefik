# Stack Docker Swarm: Traefik v3 + servicio de ejemplo (whoami)
# Despliegue: ./scripts/deploy.sh   (o .\scripts\deploy.ps1 en Windows)
# Variables requeridas (ver .env.example): DOMAIN, ACME_EMAIL

services:
  traefik:
    image: traefik:v3.3
    command:
      # Proveedores
      - --providers.swarm=true
      - --providers.swarm.endpoint=unix:///var/run/docker.sock
      - --providers.swarm.exposedByDefault=false
      - --providers.swarm.network=traefik-public
      - --providers.file.filename=/etc/traefik/dynamic.yml
      - --providers.file.watch=true
      # Entrypoints + redirección HTTP -> HTTPS
      - --entrypoints.web.address=:80
      - --entrypoints.web.http.redirections.entrypoint.to=websecure
      - --entrypoints.web.http.redirections.entrypoint.scheme=https
      - --entrypoints.web.http.redirections.entrypoint.permanent=true
      - --entrypoints.websecure.address=:443
      - --entrypoints.websecure.http.tls.certresolver=le
      # Let's Encrypt (TLS-ALPN-01)
      - --certificatesresolvers.le.acme.email=${ACME_EMAIL:?Define ACME_EMAIL}
      - --certificatesresolvers.le.acme.storage=/letsencrypt/acme.json
      - --certificatesresolvers.le.acme.tlschallenge=true
      - --certificatesresolvers.le.acme.caserver=${ACME_CA_SERVER:-https://acme-v02.api.letsencrypt.org/directory}
      # Dashboard, healthcheck y observabilidad
      - --api.dashboard=true
      - --ping=true
      - --log.level=${TRAEFIK_LOG_LEVEL:-INFO}
      - --accesslog=true
      - --accesslog.format=json
      - --global.sendAnonymousUsage=false
    ports:
      # Modo host para conservar la IP real del cliente (necesario para el rate limit)
      - target: 80
        published: 80
        protocol: tcp
        mode: host
      - target: 443
        published: 443
        protocol: tcp
        mode: host
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - letsencrypt:/letsencrypt
    configs:
      - source: traefik_dynamic
        target: /etc/traefik/dynamic.yml
    secrets:
      - dashboard_users
    networks:
      - traefik-public
    healthcheck:
      test: ["CMD", "traefik", "healthcheck", "--ping"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      update_config:
        parallelism: 1
        order: stop-first
        failure_action: rollback
      restart_policy:
        condition: any
        delay: 5s
      resources:
        limits:
          cpus: "0.50"
          memory: 256M
      labels:
        - traefik.enable=true
        - traefik.http.routers.dashboard.rule=Host(`traefik.${DOMAIN:?Define DOMAIN}`)
        - traefik.http.routers.dashboard.entrypoints=websecure
        - traefik.http.routers.dashboard.tls.certresolver=le
        - traefik.http.routers.dashboard.service=api@internal
        - traefik.http.routers.dashboard.middlewares=dashboard-auth,secure-chain@file
        - traefik.http.middlewares.dashboard-auth.basicauth.usersfile=/run/secrets/dashboard_users
        - traefik.http.middlewares.dashboard-auth.basicauth.realm=traefik
        # Swarm exige un puerto de servicio aunque se use api@internal
        - traefik.http.services.dashboard-noop.loadbalancer.server.port=9999

  whoami:
    image: traefik/whoami:v1.10
    networks:
      - traefik-public
    # traefik/whoami es una imagen "scratch" (sin shell ni curl), por eso su salud
    # la verifica Traefik vía /health. Para tus propias imágenes añade un healthcheck
    # de contenedor, por ejemplo:
    # healthcheck:
    #   test: ["CMD", "wget", "-qO-", "http://localhost:8080/health"]
    #   interval: 10s
    #   timeout: 3s
    #   retries: 3
    deploy:
      replicas: ${WHOAMI_REPLICAS:-2}
      update_config:
        parallelism: 1
        delay: 10s
        order: start-first # levanta la nueva tarea antes de detener la anterior
        failure_action: rollback # rollback automático si la actualización falla
        monitor: 30s
        max_failure_ratio: 0
      rollback_config:
        parallelism: 1
        order: start-first
        monitor: 15s
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
        window: 60s
      resources:
        limits:
          cpus: "0.25"
          memory: 64M
      labels:
        - traefik.enable=true
        - traefik.http.routers.whoami.rule=Host(`whoami.${DOMAIN:?Define DOMAIN}`)
        - traefik.http.routers.whoami.entrypoints=websecure
        - traefik.http.routers.whoami.tls.certresolver=le
        - traefik.http.routers.whoami.middlewares=secure-chain@file
        - traefik.http.services.whoami.loadbalancer.server.port=80
        - traefik.http.services.whoami.loadbalancer.healthcheck.path=/health
        - traefik.http.services.whoami.loadbalancer.healthcheck.interval=10s
        - traefik.http.services.whoami.loadbalancer.healthcheck.timeout=3s

networks:
  traefik-public:
    external: true

volumes:
  letsencrypt: {}

configs:
  traefik_dynamic:
    file: ./traefik/dynamic.yml

secrets:
  dashboard_users:
    external: true
